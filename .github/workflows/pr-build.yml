name: PR Checks

on:
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
      checks: write # Required for dorny/test-reporter
    steps:
      - uses: actions/checkout@v5

      - name: Check for source file changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'test/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.js'
              - 'package*.json'

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and Format
        run: npm run check

      - name: Security Scan
        if: steps.filter.outputs.src == 'true'
        run: npm audit --audit-level=high

      - name: Build
        if: steps.filter.outputs.src == 'true'
        run: npm run build

      - name: Run Tests
        if: steps.filter.outputs.src == 'true'
        run: npm run test:run

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: always() && steps.filter.outputs.src == 'true'
        with:
          name: Unit Tests
          path: junit.xml
          reporter: jest-junit

      - name: 'Report Coverage'
        if: always() && steps.filter.outputs.src == 'true'
        uses: davelosert/vitest-coverage-report-action@v2
