server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve files directly, falling back to index.html for the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed/static assets aggressively; they are content-hashed by Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
