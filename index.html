<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arena Fight</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100%;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #ddd;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      #game {
        box-shadow: 0 0 24px rgba(255, 255, 255, 0.08);
        line-height: 0;
        touch-action: none;
        overscroll-behavior: none;
      }
      #game canvas {
        display: block;
      }
      /* Mobile/touch only: let the FIT canvas fill the viewport edge-to-edge.
         Desktop windowed (no .touch class) keeps the flex-centered 800x600 box. */
      body.touch {
        overflow: hidden;
      }
      body.touch,
      html:has(body.touch) {
        height: 100%;
      }
      body.touch #game {
        width: 100%;
        height: 100%;
        box-shadow: none;
      }
      #rotate-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        background: #000;
        color: #ddd;
      }
      #rotate-overlay:not([hidden]) {
        display: flex;
      }
      #rotate-overlay .rotate-icon {
        font-size: 64px;
        animation: rotate-hint 1.6s ease-in-out infinite;
      }
      #rotate-overlay p {
        font-size: 18px;
        margin-top: 16px;
        padding: 0 24px;
      }
      @keyframes rotate-hint {
        0%, 60% { transform: rotate(0deg); }
        100% { transform: rotate(90deg); }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-overlay" hidden>
      <div class="rotate-inner">
        <div class="rotate-icon">⟳</div>
        <p>Rotate your device to landscape</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
